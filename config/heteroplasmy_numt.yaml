# Native-coordinate local heteroplasmy + NUMT analysis.
# This file can be used directly with run_local_heteroplasmy_qc.py while the
# feature branch is under review.  The same section is intended to be merged
# into qc_preprocessing.yaml when the workflow integration is finalized.

local_heteroplasmy_qc:
  enabled: true
  source_report: results/qc/pre_liftover_variant_qc/reports/source_variant_qc.tsv
  sample_ref_file: config/sample_ref_file.tsv
  output_dir: results/qc/local_heteroplasmy_qc

  # Strict cluster-discovery HET definition: PASS/QC-PASS, DP > 100,
  # 0.10 < source AF < 0.95.
  dp_min: 100
  heteroplasmy_af_min: 0.10
  heteroplasmy_af_max: 0.95

  # Local AF-coherent cluster detection.
  mt_length: 16569
  window_bp: 250
  af_span_max: 0.06
  min_seed_variants: 3
  simulations: 2000
  empirical_p_max: 0.01
  random_seed: 20260904

  # Upstream NUMT discovery outputs.  pident/alignment length/read support are
  # retained for reporting and tie-breaking only; no new downstream threshold
  # is imposed here.
  numt_besthit_dir: /nfs/roberts/pi/pi_njl27/lt692/primate_results/numt_besthit
  numt_besthit_pattern: "{sample}.numt_besthit.tsv,{sample}.besthit.tsv,{sample}.tsv"
  numt_highconf_dir: /nfs/roberts/pi/pi_njl27/lt692/numt_discovery/primate_results_numt_besthit_strict
  numt_highconf_pattern: "{sample}.highconf_numt.bed"

  # A cluster is regionally NUMT-supported when at least two cluster variants
  # and at least half of cluster variants overlap a NUMT -> chrM besthit interval.
  numt_min_overlap_variants: 2
  numt_min_overlap_fraction: 0.50

  # Species intervals are built only within the same species/reference_key.
  # Another sample from the same species must support the interval before it is
  # used to rescue a sample-level NUMT-negative cluster.
  species_numt_merge_gap_bp: 0

  # Same-species POS+REF+ALT recurrence.
  recurrence_min_shared_variants: 2
  recurrence_min_shared_fraction: 0.50
  recurrence_max_median_af_difference: 0.05

  # Conservative production actions.
  # - direct sample NUMT overlap: remove cluster variants
  # - species NUMT + recurrence: remove cluster variants
  # - species NUMT alone / recurrence alone: flag only
  # - unresolved: keep
  sample_numt_action: REMOVE
  species_numt_recurrent_action: REMOVE
  species_numt_only_action: FLAG
  recurrence_only_action: FLAG
  unresolved_action: KEEP
